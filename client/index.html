<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="An immersive virtual office" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <!--
      看板の文字用。日本語のグリフを持つゴシック体で、小さい字でも読みやすい。
      Google Fontsの日本語はunicode-rangeで細かく分割配信されるため、
      実際に使う字だけがダウンロードされる。
    -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700&display=swap"
    />
    <!-- 
      Hacky fix for peerjs' issue with Vite.
      See: https://github.com/peers/peerjs/issues/753
    -->
    <script>
      var parcelRequire
    </script>

    <title>SkyOffice</title>
    <style>
      /* 読み込み中の表示。JS/アセットのダウンロード中に真っ黒で「壊れた？」と
         思われないよう、すぐ出る。Reactがマウントすると #root ごと置き換わって消える。 */
      @keyframes sk-spin { to { transform: rotate(360deg); } }
      #initial-loader {
        position: fixed; inset: 0; z-index: 1;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; background: #1a1d29; color: #cfd6e6;
        font-family: 'Roboto', system-ui, sans-serif;
      }
      #initial-loader .sp {
        width: 46px; height: 46px; border-radius: 50%;
        border: 4px solid rgba(255,255,255,0.15); border-top-color: #3ddc97;
        animation: sk-spin 0.9s linear infinite;
      }
      #initial-loader .t1 { font-size: 15px; }
      #initial-loader .t2 { font-size: 12px; color: #8a91a6; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div id="initial-loader">
        <div class="sp"></div>
        <div class="t1">読み込み中…</div>
        <div class="t2">初回は少し時間がかかります</div>
      </div>
    </div>
    <div id="phaser-container"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
