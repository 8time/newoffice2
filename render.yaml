services:
  - type: web
    name: newoffice2
    env: node
    buildCommand: npm install --include=dev --legacy-peer-deps && cd types && npm install --legacy-peer-deps && cd ../client && npm install --legacy-peer-deps && npm run build && cd .. && npx tsc -p server/tsconfig.server.json
    startCommand: node server-start.js
    envVars:
      - key: NODE_ENV
        value: production
      # 会議室の内容・画像の永続化に使うSupabaseの接続情報。
      # Renderのディスクは再起動で消えるため、未設定だとデータは保存されない。
      # 値はRenderのダッシュボードで設定する（sync:false = リポジトリには置かない）
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
